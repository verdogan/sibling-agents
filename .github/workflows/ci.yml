name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ling, overlord]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm run build
      - if: matrix.package == 'ling'
        run: npm run deploy-check
      # The egress gate is only real against a browser, so it gets one here.
      - if: matrix.package == 'ling'
        run: npx playwright install --with-deps chromium
      - if: matrix.package == 'ling'
        run: npm run egress-check
